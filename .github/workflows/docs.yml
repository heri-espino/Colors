name: docs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: sphinx-build -W -b html docs/source docs/_build/html
